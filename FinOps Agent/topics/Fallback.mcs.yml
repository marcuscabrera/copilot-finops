# Name: Fallback
# This system topic triggers when the user's utterance does not match any existing topics.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  actions:
    - kind: ConditionGroup
      id: conditionGroup_LktzXw
      conditions:
        - id: conditionItem_tlGIVo
          condition: =System.FallbackCount < 3
          actions:
            - kind: SendActivity
              id: sendMessage_QZreqo
              activity: I'm sorry, I couldn't map this request yet. I currently support FinOps guidance for Azure/Microsoft services and Huawei Cloud. Please rephrase with the provider and service name.

      elseActions:
        - kind: BeginDialog
          id: 5aXj5M
          dialog: crea1_finOpsProjectValidator.topic.Escalate

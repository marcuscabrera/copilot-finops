# Name: Conversational boosting
# Create generative answers from knowledge sources.
kind: AdaptiveDialog
beginDialog:
  kind: OnUnknownIntent
  id: main
  priority: -1
  actions:
    - kind: SetTextVariable
      id: setTextVariable_user_input_lower
      variable: Topic.UserInputLower
      value: =Lower(System.Activity.Text)

    - kind: ConditionGroup
      id: provider-routing
      conditions:
        - id: unsupported-provider
          condition: =IsMatch(Topic.UserInputLower, "\\b(aws|google\\s+cloud|gcp|oracle\\s+cloud|oci|alibaba\\s+cloud|alicloud)\\b")
          actions:
            - kind: SendActivity
              id: sendMessage_unsupported_provider
              activity: I currently provide FinOps guidance for Azure/Microsoft services and Huawei Cloud. Please ask your question for one of these providers, or request an Azure vs Huawei comparison.

            - kind: EndDialog
              id: end_unsupported_provider
              clearTopicQueue: true

        - id: ambiguous-provider
          condition: =And(IsMatch(Topic.UserInputLower, "\\b(multi-cloud|multicloud|cross-cloud|cross\\s+cloud|compare\\s+providers|comparar\\s+provedores|provedor|provedores)\\b"), Not(IsMatch(Topic.UserInputLower, "azure|huawei")))
          actions:
            - kind: SendActivity
              id: sendMessage_ambiguous_provider
              activity: |-
                To help accurately, which provider should I use for this analysis: Azure, Huawei Cloud, or an Azure vs Huawei comparison?

            - kind: EndDialog
              id: end_ambiguous_provider
              clearTopicQueue: true

        - id: comparison-hint
          condition: =And(IsMatch(Topic.UserInputLower, "huawei"), IsMatch(Topic.UserInputLower, "azure|compare|comparar|versus|vs"))
          actions:
            - kind: SendActivity
              id: sendMessage_comparison_hint
              activity: Great, I'll frame the answer as an Azure vs Huawei comparison and cite official sources from both providers.

    - kind: SearchAndSummarizeContent
      id: search-content
      variable: Topic.Answer
      userInput: =System.Activity.Text

    - kind: ConditionGroup
      id: has-answer-conditions
      conditions:
        - id: has-answer
          condition: =!IsBlank(Topic.Answer)
          actions:
            - kind: EndDialog
              id: end-topic
              clearTopicQueue: true
        - id: huawei-no-answer
          condition: =And(IsBlank(Topic.Answer), IsMatch(Topic.UserInputLower, "huawei"))
          actions:
            - kind: SendActivity
              id: sendMessage_huawei_no_answer
              activity: I couldn't find enough official Huawei Cloud context for this request yet. Please share the exact Huawei service (for example ECS, OBS, VPC, RDS, CCE, CDN, or WAF) and, if possible, your target region so I can provide a more precise FinOps analysis.

# Docker Compose para FinOps Agents
# Versão do Compose specification
version: "3.9"

services:
  # Serviço da aplicação FinOps Agents
  finops-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finops-agents-app
    restart: unless-stopped
    environment:
      # Variáveis de ambiente sensíveis - use .env ou docker secrets em produção
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - FINOPS_TEMPERATURE=${FINOPS_TEMPERATURE:-0.2}
      - FINOPS_MAX_TOKENS=${FINOPS_MAX_TOKENS:-1200}
    volumes:
      # Volume para persistência de dados da aplicação (logs, cache, etc.)
      - finops_app_data:/app/data
      # Mount opcional para desenvolvimento (comente em produção)
      # - ./src:/app/src:ro
    networks:
      - finops-network
    depends_on: []
    # healthcheck:
    #   test: ["CMD", "python", "-c", "print('healthy')"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 10s

  # Serviço do banco de dados PostgreSQL (opcional - para futuras extensões)
  # Este serviço é preparado para quando o projeto necessitar de persistência em banco de dados
  finops-db:
    image: postgres:15-alpine
    container_name: finops-agents-db
    restart: unless-stopped
    environment:
      # Credenciais do banco de dados - OBRIGATÓRIO configurar via .env
      - POSTGRES_USER=${POSTGRES_USER:-finops_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-finops_db}
    volumes:
      # Volume nomeado para persistência dos dados do PostgreSQL
      - finops_db_data:/var/lib/postgresql/data
      # Script de inicialização personalizado (opcional)
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - finops-network
    ports:
      # Expõe a porta apenas para desenvolvimento/debug (comente em produção)
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finops_user} -d ${POSTGRES_DB:-finops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# Redes definidas pelo usuário
networks:
  finops-network:
    driver: bridge
    name: finops-network

# Volumes nomeados para persistência de dados
volumes:
  finops_app_data:
    driver: local
    name: finops_app_data
  finops_db_data:
    driver: local
    name: finops_db_data
